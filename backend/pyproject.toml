[project]
name = "news-backend"
version = "0.1.0"
description = "FastAPI backend for news.folding-os.com — migrated from Express"
requires-python = ">=3.12"
dependencies = [
  "foldingos-api-core @ git+https://github.com/pacificnm/foldingos-api-core.git@v0.3.0",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "feedparser>=6.0",
  "cachetools>=5.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "Depends"]
