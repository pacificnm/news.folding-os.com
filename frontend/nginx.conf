# Static SPA + same-origin proxy to this app's own backend (no CORS by design).
# `listen 3006` is the locked tunnel target: news.folding-os.com -> http://news-frontend:3006
server {
    listen 3006;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # This app's own API + OIDC relying-party routes (/auth/login,
    # /auth/callback, /auth/logout, /api/me — see build_rp_auth). Login
    # itself happens on identity.folding-os.com, not here.
    location ~ ^/(api/|auth/) {
        proxy_pass http://news-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Preserve the proto seen by the previous hop (Cloudflare tunnel sends
        # https; LAN clients send nothing) so the backend can set the session
        # cookie's Secure flag to match the transport the browser used, and
        # so the AI-endpoint rate limiter keys on the real client IP.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Connection "";
        # summarize/research stream as SSE (see StreamingResponse in
        # app/api/news.py) — buffering would hold the whole response until
        # the model finishes, defeating the point of streaming it.
        proxy_buffering off;
    }

    add_header Cache-Control "no-cache" always;
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # nginx has no built-in mime type for .webmanifest — without this it
    # serves as application/octet-stream, which some browsers' PWA
    # installability checks reject outright.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
